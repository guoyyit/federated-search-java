spring.application.name=federated-search

federated.search.global-concurrency=8
federated.search.dedup-strategy=DOC_ID
federated.search.snippet-length=160
federated.search.highlight-prefix=<em>
federated.search.highlight-suffix=</em>
federated.search.snapshot-ttl=PT10M
federated.search.snapshot-max=100

federated.search.sources.catalog.timeout=PT1S
federated.search.sources.catalog.weight=1.0
federated.search.sources.docs.timeout=PT1S
federated.search.sources.docs.weight=0.8
federated.search.sources.news.timeout=PT1S
federated.search.sources.news.weight=1.2
